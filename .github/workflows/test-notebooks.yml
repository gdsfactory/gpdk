name: Test notebooks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install native FEM dependencies
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxi-dev libxmu-dev libglu1-mesa-dev gmsh python3-gmsh
      - name: Install dependencies
        run: uv sync --extra dev --extra femwell
      - name: Execute all notebooks
        env:
          RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
        run: make test-notebooks
