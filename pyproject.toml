# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=3.2,<5"]

[dependency-groups]
dev = [
  "ruff>=0.16.5"
]

[project]
authors = [{name = "gdsfactory community", email = "contact@gdsfactory.com"}]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent"
]
dependencies = [
  "gdsfactory~=9.49.0",
  "gplugins[sax]~=2.1.0"
]
description = "Generic PDK for gdsfactory"
keywords = ["eda", "photonics", "python", "pdk"]
license = {file = "LICENSE"}
name = "gpdk"
readme = "README.md"
requires-python = ">=3.12,<3.15"
version = "0.0.1"

[project.optional-dependencies]
dev = [
  "gdsfactoryplus",
  "jsondiff",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-github-actions-annotate-failures",
  "pytest-randomly",
  "pytest_regressions",
  "tbump",
  "towncrier"
]
docs = [
  "jupyter",
  "jupyter-book",
  "jupytext",
  "nbconvert",
  "mkdocstrings[python]>=0.27.0",
  "zensical>=0.0.40,<0.1.0"
]

[tool.codespell]
ignore-words-list = "te, te/tm, ba, fpr, fpr_spacing, ro, nd, donot, schem"

[tool.gdsfactoryplus]
name = "gpdk"

[tool.gdsfactoryplus.drc]
timeout = 300

[tool.gdsfactoryplus.pdk]
name = "gpdk"

[tool.gdsfactoryplus.sim.wls]
max = 1.6
min = 1.5
num = 1000

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
addopts = '--tb=short'
python_files = ["gpdk/*.py", "tests/*.py"]
testpaths = ["gpdk/", "tests"]

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = [
  "B008",
  "B905",
  "C408",
  "C901",
  "E501"
]
select = ["B", "C", "D", "E", "F", "I", "T10", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403", "F405"]
# UP037 misfires inside a Literal[...] string member under postponed annotations,
# stripping its quotes; see .github/generate_cells.py's write_all() for the full
# explanation (also passed there as --extend-ignore=UP037, since this per-file-ignore
# doesn't apply when regenerating into a tempdir outside gpdk/cells/).
"gpdk/cells/*.py" = ["F403", "F405", "UP037"]
# Generated wrappers re-emit gdsfactory's annotations verbatim and rely on a star
# import of gdsfactory.typings to resolve them.
"gpdk/cells/__init__.py" = ["F403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.package-data]
"*" = ["klayout/**/*", "gds/**/*"]

[tool.tbump]
file = [{src = "README.md"}, {src = "pyproject.toml"}, {src = "gpdk/__init__.py"}]

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "0.0.1"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[tool.towncrier]
directory = ".changelog.d"
filename = "CHANGELOG.md"
template = ".changelog.d/changelog_template.jinja"
title_format = "## {version}"
underlines = ""
